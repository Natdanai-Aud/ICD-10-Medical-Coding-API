services:
  db:
    image: postgres:16-alpine
    container_name: icd10-db
    environment:
      POSTGRES_USER: icd10
      POSTGRES_PASSWORD: icd10
      POSTGRES_DB: icd10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icd10 -d icd10"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: icd10-api
    environment:
      DATABASE_URL: postgresql+asyncpg://icd10:icd10@db:5432/icd10
      AUTH_MODE: ${AUTH_MODE:-off}
      API_KEYS: ${API_KEYS:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
